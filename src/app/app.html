<div class="main-container">
  <h3 [style.color]="isIntruded ? 'red' : 'green'">
    {{ statusMessage }}
  </h3>
  <div class="video-container">
    <video
      id="video"
      width="720"
      height="640"
      src="assets/video/NY.mp4"
      loop
      muted
      playsinline
      autoplay
    ></video>
    <canvas id="fabricCanvas" width="720" height="640"></canvas>
  </div>

  <p>Hướng dẫn: Click chuột lên video để chấm các điểm tạo vùng ROI</p>

  <div class="button-group">
    <button (click)="finishROI()">Hoàn tất (Nối điểm đầu-cuối)</button>
    <button (click)="resetROI()">Xóa hết</button>
  </div>
</div>
